<title>生活街道｜打造夢想街道</title>
<meta name="description" content="全台生活街道指認地圖：以OpenStreetMap估算路寬，指認12公尺以下、可成為生活街道的道路，並以荷蘭Sustainable Safety分級道路功能；附臺北官方測繪檢核。">
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<script>
  // 在畫面繪製前套用主題與語言（與道路安全頁共用設定），避免先閃一下另一種樣式。
  (function () {
    var q = new URLSearchParams(location.search), d = document.documentElement;
    function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    var th = q.get('theme'), lg = q.get('lang');
    if (th && /^(auto|light|dark)$/.test(th)) set('rs_theme', th); else th = get('rs_theme') || 'auto';
    if (lg && /^(zh|en)$/.test(lg)) set('lang', lg); else lg = get('lang') === 'en' ? 'en' : 'zh';
    if (th !== 'auto') d.setAttribute('data-theme', th);
    d.setAttribute('lang', lg === 'en' ? 'en' : 'zh-Hant');
    window.__RS_LANG = lg; window.__RS_THEME = th;

    // 返回連結看來源：從 Taiwan Mobility Atlas 點進來就回 atlas，其餘回打造夢想街道（同 road-safety.html）。
    var ATLAS = '/taiwan-mobility-atlas/', back = null;
    function sget(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
    function sset(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
    try {
      var r = document.referrer ? new URL(document.referrer) : null;
      if (r && r.origin === location.origin && r.pathname !== location.pathname) {
        back = r.pathname.indexOf(ATLAS) === 0 ? r.pathname + r.search : '';
      }
    } catch (e) {}
    if (back === null && q.get('from') === 'atlas') back = ATLAS;
    if (back === null) back = sget('ls_back');
    else sset('ls_back', back);
    window.__RS_BACK = back || '';                                   // '' ＝ 回打造夢想街道
  })();
</script>

<style>
/* ------------------------------------------------------------------ tokens
   與 road-safety.html 同一套：品牌色（lime／黑）用於版面。

    --c-a: #C25446; --c-b: #7CC4A0; --c-c: #A89878; --c-t: #F2F2F2; --c-d: #C25446; --c-acc: #7CC4A0;

  }
}

    let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { map.invalidateSize(); renderCounties(); }, 120); });
  }
  function renderAll() {
    renderTiles(); renderKey(); renderGo(); renderCounties(); renderPark(); renderCheck(); renderNotes();
    $('k2').textContent = T().k2; $('cap2').textContent = T().cap2;
  }

  // ================================================================ 01 結論
  function renderTiles() {
    const t = T(), S = state.d.sum, H = state.d.hier, C = state.d.check;
    const le12 = S.by_class.A.km + S.by_class.B.km, accShare = H.A.km / (H.T.km + H.D.km + H.A.km);
    const p = state.d.park && state.d.park.meta.totals.slot_m2_by_width;
    const share = (k, w) => { const B = p[k], tot = B.lt8 + B.w8_12 + B.w12_15 + B.gt15; return (w.reduce((s, x) => s + B[x], 0)) / tot; };
    const tiles = [
      { label: t.t1, value: fmtInt(le12), unit: t.t1u, note: t.t1n(pct(le12 / S.total_km)), lead: true },
      { label: t.t2, value: pct(accShare), unit: t.t2u, note: t.t2n },
      p ? { label: t.t3, value: pct(share('car', ['lt8', 'w8_12'])), unit: t.t3u, note: t.t3n } : null,
      { label: t.t4, value: pct(C.le12.recall), unit: t.t4u, note: t.t4n(pct(C.le12.precision)) },
    ].filter(Boolean);
    const box = $('tiles'); box.textContent = '';
    tiles.forEach(x => {
      const dv = el('div', { class: 'tile' + (x.lead ? ' lead-tile' : '') });
      dv.appendChild(el('div', { class: 'label' }, x.label));
      const v = el('div', { class: 'value' }, x.value);
      if (x.unit) v.appendChild(el('span', { class: 'unit' }, x.unit));
      dv.appendChild(v); dv.appendChild(el('div', { class: 'note' }, x.note));
      box.appendChild(dv);
    });
    $('lead').innerHTML = t.lead({ km: fmtInt(le12), pct: pct(le12 / S.total_km), acc: pct(accShare) });   // 模板為靜態字串，插入的只有數字
  }

  // ================================================================ 02 地圖
  const lw = (z, a, b, c) => (z <= 10 ? a : z >= 16 ? c : a + (b - a) * Math.min(1, (z - 10) / 6) + (z > 13 ? (c - b) * (z - 13) / 3 : 0));
  function buildLayers() {
    if (lsLayer) { map.removeLayer(lsLayer); lsLayer = null; }
    if (hierLayer) { map.removeLayer(hierLayer); hierLayer = null; }
    const col = { A: css('--c-a'), B: css('--c-b'), C: css('--c-c'), T: css('--c-t'), D: css('--c-d'), ACC: css('--c-acc'), bg: css('--page') };
    const line = (color, w, opacity = 0.9) => new protomapsL.LineSymbolizer({ color, width: w, opacity, lineCap: 'round', lineJoin: 'round' });
    if (state.mode === 'width') {
      lsLayer = protomapsL.leafletLayer({
        url: TILES + 'living_streets.pmtiles', maxDataZoom: 13, pane: 'roads',
        attribution: '<a href="https://github.com/yunching0513/202609---Taiwanwonnerf">Taiwanwonnerf</a> © OpenStreetMap',
        paintRules: [
          { dataLayer: 'living_streets', filter: (z, f) => f.props.cls === 'C' && state.show15, symbolizer: line(col.C, z => lw(z, 0.5, 1.2, 3), 0.8) },
          { dataLayer: 'living_streets', filter: (z, f) => f.props.cls === 'B', symbolizer: line(col.B, z => lw(z, 0.6, 1.4, 3.5)) },
          { dataLayer: 'living_streets', filter: (z, f) => f.props.cls === 'A', symbolizer: line(col.A, z => lw(z, 0.5, 1.2, 3)) },
        ], labelRules: [],
      }).addTo(map);
    } else {
      const kD = f => (f.props.link ? 0.35 : f.props.sub === '省道' ? 1 : (f.props.sub === '縣道' || f.props.sub === '市區主要幹道') ? 0.8 : 0.6);
      lsLayer = protomapsL.leafletLayer({
        url: TILES + 'living_streets.pmtiles', maxDataZoom: 13, pane: 'roads',
        attribution: '<a href="https://github.com/yunching0513/202609---Taiwanwonnerf">Taiwanwonnerf</a> © OpenStreetMap',
        paintRules: [{ dataLayer: 'living_streets', symbolizer: line(col.ACC, z => lw(z, 0.25, 0.6, 2), 0.7) }], labelRules: [],
      }).addTo(map);
      hierLayer = protomapsL.leafletLayer({
        url: TILES + 'hierarchy.pmtiles', maxDataZoom: 13, pane: 'roads',
        paintRules: [
          { dataLayer: 'hierarchy', filter: (z, f) => f.props.ss === 'D', symbolizer: line(col.D, (z, f) => lw(z, 1, 2, 4.5) * kD(f), 0.85) },
          { dataLayer: 'hierarchy', filter: (z, f) => f.props.ss === 'T', symbolizer: line(col.bg, (z, f) => lw(z, 2.6, 4.2, 8.5) * (f.props.link ? 0.45 : 1), 1) },
          { dataLayer: 'hierarchy', filter: (z, f) => f.props.ss === 'T', symbolizer: line(col.T, (z, f) => lw(z, 1.4, 2.4, 5.5) * (f.props.link ? 0.45 : 1), 0.95) },
        ], labelRules: [],
      }).addTo(map);
    }
    $('c15wrap').hidden = state.mode !== 'width';
  }
  function renderKey() {
    const t = T(), S = state.d.sum.by_class, H = state.d.hier, box = $('mkey'); box.textContent = '';
    const item = (color, label, n, w) => {
      const sp = el('span'); const i = el('i'); i.style.borderTopColor = color; i.style.borderTopWidth = (w || 3) + 'px';
      sp.appendChild(i); sp.appendChild(el('span', null, label));
      if (n != null) sp.appendChild(el('span', { class: 'n' }, fmtInt(n) + ' ' + t.km));
      box.appendChild(sp);
    };
    if (state.mode === 'width') {
      item(css('--c-a'), t.keyW.A, S.A.km); item(css('--c-b'), t.keyW.B, S.B.km);
      if (state.show15) item(css('--c-c'), t.keyW.C, S.C.km);
    } else {
      item(css('--c-t'), t.keySS.T, H.T.km, 4); item(css('--c-d'), t.keySS.D, H.D.km); item(css('--c-acc'), t.keySS.ACC, H.A.km, 1.5);
    }
  }
  function renderGo() {
    const t = T(), sel = $('goCounty'), cur = sel.value; sel.textContent = '';
    sel.appendChild(el('option', { value: 'TW' }, t.allTw));
    Object.keys(state.d.county).filter(k => COUNTY_EN[k]).forEach(k => sel.appendChild(el('option', { value: k }, cName(k))));
    sel.value = cur || 'TW';
  }
  function flyTo(k) {
    if (k === 'TW') { map.flyToBounds([[21.9, 119.9], [25.35, 122.05]], { duration: 1 }); return; }
    const b = state.d.county[k].bbox;
    map.flyToBounds([[b[1], b[0]], [b[3], b[2]]], { duration: 1.2, padding: [20, 20] });
    $('goCounty').value = k;
  }
  function pick(latlng) {
    const t = T(), info = $('info');
    const layers = state.mode === 'width' ? [['ls', lsLayer]] : [['hier', hierLayer], ['ls', lsLayer]];
    let hit = null;
    for (const [kind, layer] of layers) {
      if (!layer) continue;
      try {
        for (const [, feats] of layer.queryTileFeaturesDebug(latlng.lng, latlng.lat, 10)) {
          for (const pf of feats) {
            const p = pf.feature.props;
            if (kind === 'ls' && state.mode === 'width' && p.cls === 'C' && !state.show15) continue;
            if (kind === 'ls' && state.mode === 'width' && !['A', 'B', 'C'].includes(p.cls)) continue;
            hit = { kind, p }; break;
          }
          if (hit) break;
        }
      } catch (e) {}
      if (hit) break;
    }
    if (!hit) { info.style.display = 'none'; return; }
    const p = hit.p; info.textContent = '';
    const close = el('button', { type: 'button', 'aria-label': t.close }, '✕');
    close.addEventListener('click', () => { info.style.display = 'none'; });
    info.appendChild(close);
    info.appendChild(el('div', { class: 'tn' }, (p.ref ? p.ref + ' ' : '') + (p.name || t.unnamed)));
    const line = (k, v) => { const dv = el('div'); dv.appendChild(el('span', { class: 'meta' }, k + '　')); dv.appendChild(document.createTextNode(v)); info.appendChild(dv); };
    if (hit.kind === 'hier') {
      line(t.infoLevel, t.lvl[p.ss] || p.ss);
      line(t.infoType, String(p.sub || '') + (p.link ? ' (link)' : ''));
    } else {
      line(t.infoW, p.w + ' m');
      line(t.infoClass, t.keyW[p.cls] || p.cls);
      line(t.infoBasis, t.src[p.src] || p.src);
    }
    line(t.infoLen, p.len + ' m');
    const a = el('a', { href: 'https://www.openstreetmap.org/way/' + encodeURIComponent(p.id), target: '_blank', rel: 'noopener' }, 'OSM way/' + p.id);
    const dv = el('div', { class: 'meta' }); dv.appendChild(a); info.appendChild(dv);
    info.style.display = 'block';
  }

  // ================================================================ 03 各縣市
  function renderKeyBox(id, items) {
    const box = $(id); box.textContent = '';
    items.forEach(([k, s]) => {
      const sp = el('span', { class: 'key' }); const i = el('i'); i.style.background = `var(--c-${k})`;
      sp.appendChild(i); sp.appendChild(el('span', null, s)); box.appendChild(sp);
    });
  }
  function renderCounties() {
    const t = T(), host = $('chart3');
    ['k3', 'c3t', 'c3s', 'cap3'].forEach(k => { $(k).textContent = t[k]; });
    renderKeyBox('key3', [['a', t.keys3.a], ['b', t.keys3.b]]);
    const rows = Object.entries(state.d.county).filter(([k]) => COUNTY_EN[k])
      .map(([k, v]) => ({ k, v, a: v.A / v.total_km, b: v.B / v.total_km })).sort((p, q) => (q.a + q.b) - (p.a + p.b));
    host.querySelectorAll('svg').forEach(s => s.remove());
    const tip = host.querySelector('.tip'); tip.style.display = 'none';
    const W = Math.max(280, host.clientWidth), narrow = W < 560, rowH = narrow ? 20 : 22, gap = 6;
    const m = { l: narrow ? 92 : 108, r: 48, t: 22, b: 4 }, H = m.t + rows.length * (rowH + gap) + m.b;
    const X = v => m.l + v * (W - m.l - m.r);
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': t.c3t });
    host.insertBefore(svg, tip);
    [0, 0.25, 0.5, 0.75, 1].forEach(v => {
      svg.appendChild(sv('line', { x1: X(v), x2: X(v), y1: m.t - 4, y2: H - m.b, class: 'gridline' }));
      const tx = svg.appendChild(sv('g', { class: 'tick' })).appendChild(sv('text', { x: X(v), y: m.t - 9, 'text-anchor': 'middle' }));
      tx.textContent = Math.round(v * 100) + '%';
    });
    let hot = null;
    rows.forEach((r, i) => {
      const y = m.t + i * (rowH + gap);
      svg.appendChild(sv('text', { x: m.l - 8, y: y + rowH / 2 + 4, 'text-anchor': 'end', class: 'row-label' })).textContent = cName(r.k);
      svg.appendChild(sv('rect', { x: X(0), y, width: X(r.a) - X(0), height: rowH, class: 'seg-rect s-a' }));
      svg.appendChild(sv('rect', { x: X(r.a), y, width: X(r.a + r.b) - X(r.a), height: rowH, class: 'seg-rect s-b' }));
      svg.appendChild(sv('text', { x: X(r.a + r.b) + 6, y: y + rowH / 2 + 4, class: 'row-val' })).textContent = pct(r.a + r.b);
      const hit = svg.appendChild(sv('rect', { x: 0, y: y - gap / 2, width: W, height: rowH + gap, class: 'row-hit' }));
      const show = on => {
        if (hot) hot.classList.remove('hot'); hot = on ? hit : null;
        if (!on) { tip.style.display = 'none'; return; }
        hit.classList.add('hot'); tip.textContent = '';
        tip.appendChild(el('div', { class: 'tn' }, cName(r.k)));
        const dl = tip.appendChild(el('dl'));
        [[t.keys3.a, r.v.A], [t.keys3.b, r.v.B], [t.total, r.v.total_km]].forEach(([k, v]) => {
          dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, fmtInt(v) + ' ' + t.km));
        });
        tip.style.display = 'block';
        const s = host.clientWidth / W;
        tip.style.left = Math.max(0, Math.min(host.clientWidth - tip.offsetWidth, m.l * s)) + 'px';
        tip.style.top = ((y + rowH + 4) * s) + 'px';
      };
      hit.addEventListener('pointerenter', () => show(true));
      hit.addEventListener('pointerleave', () => show(false));
      hit.addEventListener('click', () => { flyTo(r.k); $('map').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
    });
  }

  // ================================================================ 04 臺北停車
  function renderPark() {
    const t = T(), P = state.d.park;
    if (!P) { $('park').closest('section').hidden = true; return; }
    const sh = k => { const B = P.meta.totals.slot_m2_by_width[k], tot = B.lt8 + B.w8_12 + B.w12_15 + B.gt15; return { le12: (B.lt8 + B.w8_12) / tot, lt8: B.lt8 / tot }; };
    $('park').innerHTML = t.park({ car: pct(sh('car').le12), moto: pct(sh('moto').le12), lt8: pct(sh('car').lt8) });   // 只插入數字
  }

  // ================================================================ 05 方法檢核
  function renderCheck() {
    const t = T(), C = state.d.check, M = C.meta;
    $('k5').textContent = t.k5;
    const E = C.width_error_8m_plus.all;
    const tiles = [
      { label: t.v1, value: pct(C.le12.recall), note: t.v1n, lead: true },
      { label: t.v2, value: pct(C.le12.precision), note: t.v2n },
      { label: t.v3, value: pct(C.agreement), note: t.v3n },
      { label: t.v4, value: (E.median_error_m < 0 ? '−' : '+') + Math.abs(E.median_error_m).toFixed(1), unit: t.v4u, note: t.v4n(E.median_abs_error_m.toFixed(1)) },
    ];
    const box = $('vtiles'); box.textContent = '';
    tiles.forEach(x => {
      const dv = el('div', { class: 'tile' + (x.lead ? ' lead-tile' : '') });
      dv.appendChild(el('div', { class: 'label' }, x.label));
      const v = el('div', { class: 'value' }, x.value); if (x.unit) v.appendChild(el('span', { class: 'unit' }, x.unit));
      dv.appendChild(v); dv.appendChild(el('div', { class: 'note' }, x.note)); box.appendChild(dv);
    });
    // 分級對照表
    const cm = C.confusion_km, tb = $('cmTable'); tb.textContent = '';
    const hr = tb.appendChild(el('thead')).appendChild(el('tr'));
    hr.appendChild(el('th', { scope: 'col' }, t.osmEst));
    CLS.forEach(c => hr.appendChild(el('th', { class: 'num', scope: 'col' }, t.cls[c])));
    hr.appendChild(el('th', { class: 'num', scope: 'col' }, t.total));
    const body = tb.appendChild(el('tbody'));
    CLS.forEach(a => {
      const tr = body.appendChild(el('tr'));
      tr.appendChild(el('th', { scope: 'row' }, t.cls[a]));
      let sum = 0;
      CLS.forEach(b => { const v = cm[`${a}|${b}`] || 0; sum += v; tr.appendChild(el('td', { class: 'num' + (a === b ? ' hl' : '') }, v.toFixed(1))); });
      tr.appendChild(el('td', { class: 'num' }, sum.toFixed(1)));
    });
    $('cmCap').textContent = t.cmCap({ km: fmtInt(M.km_compared), svc: fmtInt(M.km_excluded.service || 0), div: fmtInt(M.km_divided_oneway), jct: fmtInt(M.km_junction) });
    // 路名後綴
    const S = C.by_suffix_km, st = $('sfxTable'); st.textContent = '';
    const h2 = st.appendChild(el('thead')).appendChild(el('tr'));
    h2.appendChild(el('th', { scope: 'col' }, ''));
    CLS.forEach(c => h2.appendChild(el('th', { class: 'num', scope: 'col' }, t.cls[c])));
    h2.appendChild(el('th', { class: 'num', scope: 'col' }, t.total));
    const b2 = st.appendChild(el('tbody'));
    ['路', '街', '巷', '弄', '（無名或其他）'].filter(k => S[k]).forEach(k => {
      const tot = CLS.reduce((s, c) => s + S[k][c], 0), tr = b2.appendChild(el('tr'));
      tr.appendChild(el('th', { scope: 'row' }, t.sfx[k] || k));
      CLS.forEach(c => tr.appendChild(el('td', { class: 'num' }, pct(S[k][c] / tot))));
      tr.appendChild(el('td', { class: 'num' }, fmtInt(tot) + ' ' + t.km));
    });
    $('sfxCap').textContent = t.sfxCap;
  }

  // ================================================================ 06 資料與方法
  function renderNotes() {
    const en = state.lang === 'en', C = state.d.check, S = state.d.sum;
    const link = (u, s) => `<a href="${u}" rel="noopener">${s}</a>`;
    const W = S.by_width_src, tot = Object.values(W).reduce((a, b) => a + b, 0), sh = k => pct(W[k] / tot, k === 'osm_width' ? 2 : 0);
    const L = en ? {
      h1: 'Data', data: [
        `Living-street candidates and road hierarchy: ${link('https://github.com/yunching0513/202609---Taiwanwonnerf', 'Taiwanwonnerf')} (OpenStreetMap, September 2026, ODbL), ${fmtInt(S.total_ways)} segments, ${fmtInt(S.total_km)} km.`,
        `Width basis by segment: OSM width tag ${sh('osm_width')}, lane count ${sh('osm_lanes')}, road-name convention ${sh('name_suffix')}, road-class default ${sh('class_default')}. Most widths are therefore conventions, not measurements.`,
        `Taipei check: ${link(C.meta.sources.road8m, 'Public Works Department survey of roads wider than 8 m')} (2014–2016) and Taiwan Mobility Atlas district boundaries.`,
      ], h2: 'Method', method: [
        'Width classes: under 8 m (alley-type living streets), 8–12 m (local streets), 12–15 m (borderline), over 15 m.',
        'Road hierarchy follows Dutch Sustainable Safety: through roads (freeways, expressways), distributor roads (provincial, county and township roads, urban arterials and collectors), and access roads (all other streets). Taiwan’s tertiary roads often mix distributor and access roles and are provisionally treated as distributors.',
        'The living-street tiles hold only segments estimated at 15 m or narrower; wider segments are taken from the road-hierarchy tiles (ways that appear only there are counted as over 15 m).',
        `Taipei check uses z${C.meta.zoom} tiles; each OSM way is located by its midpoint and compared within ${C.meta.tolerance_m} m. Streets missing from the 8 m+ survey are assumed under 8 m; roads widened or built after 2016 are not reflected.`,
      ],
    } : {
      h1: '資料', data: [
        `生活街道候選與道路層級：${link('https://github.com/yunching0513/202609---Taiwanwonnerf', 'Taiwanwonnerf')}（OpenStreetMap，2026年9月，ODbL），共${fmtInt(S.total_ways)}條路段、${fmtInt(S.total_km)}公里。`,
        `路寬推估依據的路段比例：OSM width標籤${sh('osm_width')}、車道數推估${sh('osm_lanes')}、路名慣例${sh('name_suffix')}、道路等級預設${sh('class_default')}。換句話說，大部分路寬是依慣例推定，不是實測值。`,
        `臺北檢核：${link(C.meta.sources.road8m, '臺北市工務局〈臺北市寬度超過8公尺道路GIS圖資〉')}（103–105年測繪），行政區界取自Taiwan Mobility Atlas。`,
      ], h2: '方法', method: [
        '路寬分級：8公尺以下（巷弄型生活街道）、8–12公尺（社區街道）、12–15公尺（邊界案例）、15公尺以上。',
        '道路層級依荷蘭Sustainable Safety：通過性道路（國道、快速公路）、集散道路（省道、縣道、鄉道、市區主次要幹道）、進出道路（其餘道路）。臺灣的tertiary道路常同時具有集散與進出功能，暫歸集散道路。',
        '生活街道圖磚只收推估15公尺以下的路段；推估超過15公尺的路段，從道路層級圖磚補回（只出現在後者的路段即視為超過15公尺）。',
        `臺北檢核使用z${C.meta.zoom}圖磚，以每條OSM路段的中點定位，容許${C.meta.tolerance_m}公尺的偏移。不在8公尺以上道路圖資內者視為8公尺以下；105年以後拓寬或新闢的道路不會反映。`,
      ],
    };
    const ul = items => `<ul>${items.map(s => `<li>${s}</li>`).join('')}</ul>`;
    $('notes').innerHTML = `<h3>${L.h1}</h3>${ul(L.data)}<h3>${L.h2}</h3>${ul(L.method)}`;
  }
})();
</script>
</body>
</html>
