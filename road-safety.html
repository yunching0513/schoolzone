<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道路安全 × 國家所得｜打造夢想街道</title>
<meta name="description" content="以 WHO 道路交通死亡率與 IMF 人均 GDP 繪製的四象限比較，聚焦台灣與人口密度、氣候、文化相近的國家。">
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<script>
  // 在畫面繪製前套用主題與語言，避免先閃一下另一種樣式。
  // 可分享的網址參數：?lang=zh|en、?theme=auto|light|dark（light＝白底）。
  // 語言與主頁共用 localStorage 'lang'，在主頁切成英文，點進來就是英文。
  (function () {
    var q = new URLSearchParams(location.search), d = document.documentElement;
    function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    var th = q.get('theme'), lg = q.get('lang');
    if (th && /^(auto|light|dark)$/.test(th)) set('rs_theme', th); else th = get('rs_theme') || 'auto';
    if (lg && /^(zh|en)$/.test(lg)) set('lang', lg); else lg = get('lang') === 'en' ? 'en' : 'zh';
    if (th !== 'auto') d.setAttribute('data-theme', th);
    d.setAttribute('lang', lg === 'en' ? 'en' : 'zh-Hant');
    window.__RS_LANG = lg; window.__RS_THEME = th;

    // 返回連結看來源：從 Taiwan Mobility Atlas 點進來就回 atlas，其餘回打造夢想街道。
    // 兩站同在 yunching0513.github.io，靠 referrer 判斷；atlas 的入口另帶 ?from=atlas，
    // 以防瀏覽器不送 referrer。記在 sessionStorage，切換語言、重新整理都不會跑掉。
    var ATLAS = '/taiwan-mobility-atlas/', back = null;
    function sget(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
    function sset(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
    try {
      var r = document.referrer ? new URL(document.referrer) : null;
      if (r && r.origin === location.origin && r.pathname !== location.pathname) {
        back = r.pathname.indexOf(ATLAS) === 0 ? r.pathname + r.search : '';   // 從站內其他頁來
      }
    } catch (e) {}
    if (back === null && q.get('from') === 'atlas') back = ATLAS;
    if (back === null) back = sget('rs_back');
    else sset('rs_back', back);
    window.__RS_BACK = back || '';                                   // '' ＝ 回打造夢想街道
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens
   網站品牌色（lime／黑）用於版面框架；資料標記用經驗證的分類色。
   4 色組合在「全配對」下以色盲模擬驗證：亮色全數通過硬性門檻；
   暗色有一組（綠↔黃）落在 6–8 警示帶，因此另以「形狀」做第二編碼。 */
:root {
  color-scheme: light;
  --lime: #C8D400; --lime-dk: #A8B200;
  --page: #ffffff;              /* 白底 */
  --surface: #ffffff;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --rule: #1A1A1A;
  --hair: rgba(11,11,11,0.10);
  --c-asia: #2a78d6;
  --c-europe: #eda100;
  --c-americas: #e87ba4;
  --c-africa: #008300;
  --font-zh: 'Noto Sans TC', system-ui, sans-serif;
  --font-en: 'Space Grotesk', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --rule: #e8e8e4;
    --hair: rgba(255,255,255,0.10);
    --c-asia: #3987e5; --c-europe: #c98500; --c-americas: #d55181; --c-africa: #008300;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --rule: #e8e8e4;
  --hair: rgba(255,255,255,0.10);
  --c-asia: #3987e5; --c-europe: #c98500; --c-americas: #d55181; --c-africa: #008300;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--font-zh); line-height: 1.6; -webkit-font-smoothing: antialiased; }
.shell { max-width: 1240px; margin: 0 auto; padding: 48px 40px 80px; }

/* ------------------------------------------------------------------ header */
.page-header { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 44px; padding-bottom: 24px; border-bottom: 2px solid var(--rule); }
.logo-mark { font-family: var(--font-en); font-size: 9px; font-weight: 600; letter-spacing: .18em; border: 1.5px solid var(--rule); padding: 5px 10px; text-transform: uppercase; line-height: 1.5; white-space: nowrap; }
.title-block { flex: 1; min-width: 0; }
.eyebrow { font-family: var(--font-en); font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
h1 { font-weight: 700; font-size: 26px; letter-spacing: .04em; margin-top: 4px; line-height: 1.35; }
.sub { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
.back { font-family: var(--font-en); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--axis); white-space: nowrap; padding-bottom: 1px; }
.back:hover { color: var(--ink); border-color: var(--ink); }
.ctrls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.seg { display: inline-flex; border: 1.5px solid var(--rule); }
.seg button { font-family: var(--font-en); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; padding: 5px 10px;
  background: var(--surface); color: var(--muted); border: 0; cursor: pointer; line-height: 1.4; }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button[aria-pressed="true"] { background: var(--rule); color: var(--page); }
.seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.section { margin-bottom: 44px; }
.section-label { font-family: var(--font-en); font-size: 10px; font-weight: 600; letter-spacing: .25em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; display: flex; align-items: center; gap: 12px; }
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--grid); }

/* ------------------------------------------------------------------ stat tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--hair); padding: 16px 18px; }
.tile .label { font-size: 12px; color: var(--ink-2); }
.tile .value { font-size: 30px; font-weight: 700; line-height: 1.15; margin-top: 6px; letter-spacing: .01em; }
.tile .unit { font-size: 12px; font-weight: 400; color: var(--ink-2); margin-left: 4px; }
.tile .note { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.tile.lead { border-left: 3px solid var(--lime); }
.badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 6px; margin-left: 6px; border: 1px solid var(--ink-2); color: var(--ink-2); vertical-align: middle; letter-spacing: .04em; line-height: 1.5; }

/* ------------------------------------------------------------------ filter row（一列、在圖表上方） */
.filters { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin-bottom: 10px; }
.filters + .card { margin-top: 14px; }
.fgroup { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flabel { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); margin-right: 4px; }
.chip { font-family: var(--font-zh); font-size: 12px; padding: 6px 11px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; line-height: 1.3; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: #111; font-weight: 700; }
.chip:focus-visible, .lg-item:focus-visible, th button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.thr { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.thr input[type=range] { width: 130px; accent-color: var(--ink); }
.thr output { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 700; min-width: 58px; }
.linkbtn { font-size: 11.5px; color: var(--ink-2); background: none; border: 0; border-bottom: 1px solid var(--axis); cursor: pointer; padding: 0 0 1px; font-family: inherit; }
.linkbtn:hover { color: var(--ink); border-color: var(--ink); }

/* ------------------------------------------------------------------ chart card */
.card { background: var(--surface); border: 1px solid var(--hair); padding: 16px 16px 10px; position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 0 4px 6px; }
.lg-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); background: none; border: 0; cursor: pointer; padding: 3px 2px; font-family: inherit; }
.lg-item[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.lg-item[aria-pressed="false"] svg { opacity: .3; }
.lg-item .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.lg-note { font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font-zh); }
.tick text { font-family: var(--font-en); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.axisline { stroke: var(--axis); stroke-width: 1; }
.thrline { stroke: var(--ink-2); stroke-width: 1.5; }
.axis-title { font-size: 11.5px; fill: var(--ink-2); }
.qlabel, .qcount { pointer-events: none; }
.qlabel { font-size: 12px; font-weight: 700; fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.qcount { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.pt { stroke: var(--surface); stroke-width: 2; }            /* 2px 表面色環 */
.pt.bg { opacity: .55; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .pt.bg { opacity: .75; } }
:root[data-theme="dark"] .pt.bg { opacity: .75; }
.pt.dim { opacity: .18; }
.pt.hot { stroke: var(--ink); stroke-width: 2; opacity: 1; }
.g-asia { fill: var(--c-asia); } .g-europe { fill: var(--c-europe); }
.g-americas { fill: var(--c-americas); } .g-africa { fill: var(--c-africa); }
.tw-ring { fill: none; stroke: var(--ink); stroke-width: 2; }
.plabel { font-size: 11.5px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.plabel.tw { font-size: 13px; font-weight: 900; }
.leader { stroke: var(--muted); stroke-width: 1; pointer-events: none; }
.anchor { fill: var(--ink); stroke: var(--surface); stroke-width: 1; pointer-events: none; }
.focus-hit { fill: transparent; cursor: pointer; }
.focus-hit:focus { outline: none; }
.focus-hit:focus-visible + .focus-ring { stroke: var(--ink); stroke-width: 2; fill: none; }

.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--hair); box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 10px 12px; min-width: 190px; max-width: 260px; font-size: 12px; line-height: 1.5; display: none; }
.tip .tv { font-size: 22px; font-weight: 700; line-height: 1.1; }
.tip .tu { font-size: 11.5px; color: var(--ink-2); margin-left: 4px; }
.tip .tn { margin-top: 4px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.tip .tn .key { width: 14px; height: 2px; flex: none; }
.tip .ten { color: var(--muted); font-weight: 400; font-family: var(--font-en); }
.tip dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin-top: 6px; color: var(--ink-2); }
.tip dd { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.tip .tq { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--grid); color: var(--ink-2); }
.tip .tsrc { margin-top: 4px; font-size: 11px; color: var(--muted); }
.caption { font-size: 11.5px; color: var(--muted); margin: 8px 4px 2px; }
.more { display: inline-block; margin-top: 14px; font-size: 13px; font-weight: 700; color: var(--ink); text-decoration: none; border-bottom: 2px solid var(--lime); padding-bottom: 1px; }
.more:hover { border-color: var(--ink); }

/* ------------------------------------------------------------------ table view */
.tbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.tbar label { font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.twrap { overflow-x: auto; border: 1px solid var(--hair); background: var(--surface); -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 760px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-weight: 700; color: var(--ink-2); font-size: 11.5px; position: sticky; top: 0; background: var(--surface); }
th button { all: unset; cursor: pointer; }
th button::after { content: ' ↕'; color: var(--axis); }
th[aria-sort="ascending"] button::after { content: ' ↑'; color: var(--ink); }
th[aria-sort="descending"] button::after { content: ' ↓'; color: var(--ink); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.tw td { font-weight: 700; background: color-mix(in srgb, var(--lime) 18%, transparent); }
.swatch { display: inline-flex; align-items: center; gap: 6px; }
.tagchip { display: inline-block; font-size: 10.5px; color: var(--ink-2); border: 1px solid var(--grid); padding: 0 5px; margin-right: 3px; }

/* ------------------------------------------------------------------ notes */
.notes { background: var(--surface); border: 1px solid var(--hair); padding: 18px 22px; font-size: 13px; color: var(--ink-2); }
.notes h3 { font-size: 13px; color: var(--ink); margin: 14px 0 4px; }
.notes h3:first-child { margin-top: 0; }
.notes ul { padding-left: 1.2em; }
.notes li { margin: 3px 0; }
.notes a { color: var(--ink); }
.notes code { font-size: 12px; background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 0 4px; }

.empty { background: var(--surface); border: 1px solid var(--hair); padding: 28px; font-size: 13.5px; color: var(--ink-2); }
.empty code { background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 1px 6px; }

footer { border-top: 2px solid var(--rule); padding-top: 18px; margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-family: var(--font-en); font-size: 9px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
footer a { color: var(--ink-2); }

/* ------------------------------------------------------------------ mobile */
@media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) {
  .shell { padding: 28px 16px 56px; }
  .page-header { flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 32px; }
  .title-block { width: 100%; }
  .ctrls { flex-direction: row; flex-wrap: wrap; align-items: center; }
  h1 { font-size: 21px; }
  .tile .value { font-size: 24px; }
  .tile .unit { display: block; margin: 2px 0 0; }
  .tile .badge { margin: 4px 0 0; }
  .tile { padding: 14px; }
  .filters { gap: 10px; }
  .thr { width: 100%; }
  .thr input[type=range] { flex: 1; width: auto; }
  .chip { padding: 8px 12px; }
  .card { padding: 12px 6px 8px; }
  .notes { padding: 16px; }
}
@media (prefers-reduced-motion: no-preference) { .pt { transition: opacity .15s; } }
</style>
</head>
<body>
<div class="shell">

<header class="page-header">
  <div class="logo-mark">Taiwan<br>Mobility<br>Atlas</div>
  <div class="title-block">
    <div class="eyebrow">Road Safety × Income · Four Quadrants</div>
    <h1 data-i18n="h1">道路安全 × 國家所得｜台灣在世界的位置</h1>

    <div class="seg" id="langSeg" role="group" data-i18n-aria="langAria">

      <button type="button" data-theme-opt="auto" data-i18n="thAuto">自動</button><button type="button" data-theme-opt="light" data-i18n="thLight">白底</button><button type="button" data-theme-opt="dark" data-i18n="thDark">深色</button>

<div id="app" hidden>

  <div class="tiles" id="tiles"></div>
</section>

<section class="section" aria-labelledby="s2">
  <div class="section-label" id="s2" data-i18n="s2">02 — 四象限：道路安全 × 人均 GDP</div>

  <div class="filters" role="group" data-i18n-aria="hlAria">
    <div class="fgroup" id="chips"></div>
  </div>
  <div class="filters" role="group" data-i18n-aria="thrAria">

<script>
(function () {
  'use strict';

  // ================================================================ 文字（中／英）
  // 介面字串集中於此；國名直接用資料中的 zh / en 欄位。
  const QNUM = { 1: '①', 2: '②', 3: '③', 4: '④' };
  const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));
  const I18N = {
    zh: {

  // 標籤擺放順序：台灣 → 使用者點名的德國、美國、澳洲 → 政策標竿（瑞典 Vision Zero、荷蘭 Sustainable Safety）→ 其他
  const LABEL_PRIORITY = ['TWN', 'DEU', 'USA', 'AUS', 'SWE', 'NLD', 'JPN', 'KOR', 'CHN', 'GBR', 'FRA', 'SGP',
    'VNM', 'THA', 'MYS', 'IDN', 'PHL', 'IND', 'BRA', 'CAN', 'ITA', 'ESP', 'ISR', 'BEL', 'NZL', 'MEX',
    'RUS', 'ZAF', 'NGA', 'LKA', 'BGD'];

  // 大洲分組：只用 4 組，因為散佈圖上任兩點都可能相鄰。8 色取 6 的 28 種組合
  // 在色盲模擬（全配對）下全部無法通過門檻；4 色則可通過，並以形狀做第二編碼。
  const GROUPS = [
    { key: 'asia', shape: 'circle' }, { key: 'europe', shape: 'square' },
    { key: 'americas', shape: 'triangle' }, { key: 'africa', shape: 'diamond' },
  ];
  const GROUP = Object.fromEntries(GROUPS.map(g => [g.key, g]));

  const state = {
    data: null, meta: null, tw: null,
    lang: window.__RS_LANG === 'en' ? 'en' : 'zh',
    theme: window.__RS_THEME || 'auto',
    highlight: 'default',               // default | focus | major | culture | climate | density | moto | benchmark | none
    hidden: new Set(),
    thr: { gdp: 0, rate: 0 }, def: { gdp: 0, rate: 0 },
    sort: { key: 'rate', dir: 1 }, showAll: false,
    view: 'all',                        // all | rich（放大富裕國家）
  };
  const T = () => I18N[state.lang];
  const nameOf = c => (state.lang === 'en' ? c.en : c.zh);
  const altName = c => (state.lang === 'en' ? c.zh : c.en);

  const $ = id => document.getElementById(id);
  const fmtInt = v => Math.round(v).toLocaleString('en-US');
  const fmtUSD = v => '$' + fmtInt(v);
  const fmt1 = v => (v == null ? '—' : Number(v).toFixed(1));
  const median = a => { const s = a.slice().sort((x, y) => x - y), n = s.length;
    return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; };
  const el = (tag, attrs, text) => {           // 名稱一律走 textContent（資料視為不受信任）
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  };
  const NS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs) => { const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  const quadOf = c => {
    const rich = c.gdp_pc >= state.thr.gdp, low = c.rate < state.thr.rate;
    return rich && low ? 1 : !rich && low ? 2 : rich ? 3 : 4;
  };
  const quadText = q => `${QNUM[q]} ${T().quad[q]}`;
  const matches = (c, k) => k === 'default' ? (c.focus || c.tags.includes('major'))
    : k === 'focus' ? c.focus : k === 'none' ? false : c.tags.includes(k);
  const isHi = c => c.iso3 === 'TWN' || matches(c, state.highlight);

  // 同面積的四種形狀（圓／方／三角／菱），讓大小不因形狀失真
  function shapePath(shape, x, y, r) {
    switch (shape) {
      case 'square': { const h = r * 0.886; return `M${x - h},${y - h}h${2 * h}v${2 * h}h${-2 * h}Z`; }
      case 'triangle': { const a = r * 2.694, H = a * 0.866;
        return `M${x},${y - 2 * H / 3}L${x + a / 2},${y + H / 3}L${x - a / 2},${y + H / 3}Z`; }
      case 'diamond': { const d = r * 1.2533; return `M${x},${y - d}L${x + d},${y}L${x},${y + d}L${x - d},${y}Z`; }
      default: return `M${x - r},${y}a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 ${-2 * r},0`;
    }
  }
  function keySwatch(group, size) {
    const s = sv('svg', { width: size, height: size, viewBox: `0 0 ${size} ${size}`, 'aria-hidden': 'true' });
    s.appendChild(sv('path', { d: shapePath(GROUP[group].shape, size / 2, size / 2 + (GROUP[group].shape === 'triangle' ? 1 : 0), size * 0.36), class: 'g-' + group }));
    return s;
  }

  // ================================================================ 語言與主題
  function applyStatic() {
    const t = T();
    document.documentElement.setAttribute('lang', t.htmlLang);
    document.title = t.title;
    const md = document.querySelector('meta[name=description]'); if (md) md.setAttribute('content', t.desc);
    const src = window.__RS_BACK ? 'Atlas' : '';                   // back／footBack 依來源換字
    document.querySelectorAll('[data-i18n]').forEach(e => { const k = e.dataset.i18n; e.textContent = t[k + src] || t[k]; });
    document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t[e.dataset.i18nAria]); });
    document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
    document.querySelectorAll('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeOpt === state.theme)));
    $('empty').innerHTML = t.empty;                                // 靜態字串，非資料內容
    if (window.__RS_BACK) document.querySelectorAll('a[data-i18n="back"], a[data-i18n="footBack"]').forEach(a => { a.href = window.__RS_BACK; });
  }
  function setLang(l) {
    state.lang = l;
    try { localStorage.setItem('lang', l); } catch (e) {}           // 與主頁共用同一個語言設定
    applyStatic();
    if (state.data) { renderStaticParts(); renderAll(); }
  }
  function setTheme(th) {
    state.theme = th;
    try { localStorage.setItem('rs_theme', th); } catch (e) {}
    if (th === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', th);
    applyStatic();
  }
  document.querySelectorAll('#langSeg button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  document.querySelectorAll('#themeSeg button').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeOpt)));
  applyStatic();

  // ================================================================ 載入
  fetch('data/road_safety_gdp.json', { cache: 'no-cache' })
    .then(r => (r.ok ? r.json() : Promise.reject(new Error('http ' + r.status))))
    .then(init)
    .catch(() => { $('empty').hidden = false; });

  function init(d) {
    state.data = d.countries;
    state.meta = d.meta;
    state.tw = d.countries.find(c => c.iso3 === 'TWN');
    state.def.gdp = d.meta.gdp_threshold;
    // 死亡率門檻：WHO 全球估計值；若資料沒有，退回各國中位數
    state.def.rate = d.meta.global_rate != null ? d.meta.global_rate : median(d.countries.map(c => c.rate));
    state.thr = { ...state.def };
    $('app').hidden = false;
    buildThresholds();
    renderStaticParts();
    renderAll();
    let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(renderChart, 120); });
    $('showAll').addEventListener('change', e => { state.showAll = e.target.checked; renderTable(); });
    document.querySelectorAll('#viewSeg .chip').forEach(b => b.addEventListener('click', () => {
      state.view = b.dataset.view; syncView(); renderChart();
    }));
    syncView();
  }
  function syncView() {
    document.querySelectorAll('#viewSeg .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
  }

  function renderStaticParts() {
    $('subline').textContent = T().subline(state.meta.year, state.data.length);
    buildChips(); buildLegend(); buildNotes();
  }
  function renderAll() { renderTiles(); renderChart(); renderTable(); }

  // ================================================================ 控制列
  function buildChips() {
    const box = $('chips');
    box.textContent = '';
    box.appendChild(el('span', { class: 'flabel' }, T().hlLabel));
    ['default', 'focus', 'major', 'culture', 'climate', 'density', 'moto', 'benchmark', 'none'].forEach(k => {
      const label = T().chips[k];
      const n = k === 'none' ? null : state.data.filter(c => c.iso3 !== 'TWN' && matches(c, k)).length;
      const b = el('button', { type: 'button', class: 'chip', 'data-k': k, 'aria-pressed': String(state.highlight === k) },
                   n == null ? label : `${label} ${n}`);
      b.addEventListener('click', () => {
        state.highlight = k;
        box.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        renderChart(); renderTable();
      });
      box.appendChild(b);
    });
  }

  function buildThresholds() {
    const g = $('gdpThr'), r = $('rateThr');
    const sync = () => {
      g.value = Math.log10(state.thr.gdp); r.value = state.thr.rate;
      $('gdpOut').textContent = fmtUSD(state.thr.gdp);
      $('rateOut').textContent = fmt1(state.thr.rate);
    };
    g.addEventListener('input', () => { state.thr.gdp = Math.round(10 ** +g.value / 50) * 50; sync(); renderAll(); });
    r.addEventListener('input', () => { state.thr.rate = +r.value; sync(); renderAll(); });
    $('thrReset').addEventListener('click', () => { state.thr = { ...state.def }; sync(); renderAll(); });
    sync();
  }

  function buildLegend() {
    const lg = $('legend');
    lg.textContent = '';
    lg.setAttribute('aria-label', T().legendAria);
    GROUPS.forEach(g => {
      const n = state.data.filter(c => c.group === g.key).length;
      const b = el('button', { type: 'button', class: 'lg-item', 'data-g': g.key, 'aria-pressed': String(!state.hidden.has(g.key)) });
      b.appendChild(keySwatch(g.key, 14));
      b.appendChild(el('span', null, T().groups[g.key]));
      b.appendChild(el('span', { class: 'n' }, String(n)));
      b.addEventListener('click', () => {
        state.hidden.has(g.key) ? state.hidden.delete(g.key) : state.hidden.add(g.key);
        b.setAttribute('aria-pressed', String(!state.hidden.has(g.key)));
        renderChart();
      });
      lg.appendChild(b);
    });
    const note = el('span', { class: 'lg-note' });
    const s = sv('svg', { width: 20, height: 20, viewBox: '0 0 20 20', 'aria-hidden': 'true' });
    s.appendChild(sv('circle', { cx: 10, cy: 10, r: 4.5, class: 'g-asia' }));
    s.appendChild(sv('circle', { cx: 10, cy: 10, r: 8, class: 'tw-ring' }));
    note.appendChild(s); note.appendChild(document.createTextNode(T().legendNote));
    lg.appendChild(note);
  }

  // ================================================================ 01 台灣在哪裡
  function renderTiles() {
    const tw = state.tw, box = $('tiles'), t = T();
    box.textContent = '';
    if (!tw) return;
    const rich = state.data.filter(c => c.iso3 !== 'TWN' && c.gdp_pc >= state.thr.gdp);
    const med = median(rich.map(c => c.rate));
    const ranked = rich.concat([tw]).sort((a, b) => b.rate - a.rate);
    const rank = ranked.indexOf(tw) + 1;
    const unverified = state.meta.taiwan && state.meta.taiwan.verified === false;
    const tile = (label, value, unit, note, lead, badge) => {
      const d = el('div', { class: 'tile' + (lead ? ' lead' : '') });
      d.appendChild(el('div', { class: 'label' }, label));
      const v = el('div', { class: 'value' }, value);
      if (unit) v.appendChild(el('span', { class: 'unit' }, unit));
      if (badge) v.appendChild(el('span', { class: 'badge', title: t.badgeTitle }, badge));
      d.appendChild(v);
      if (note) d.appendChild(el('div', { class: 'note' }, note));
      box.appendChild(d);
    };
    tile(t.t1, fmt1(tw.rate), t.unit, t.t1note(fmtInt(state.meta.taiwan.deaths_30d)), true, unverified ? t.badge : null);
    tile(t.t2, fmt1(med), t.unit, t.t2note(fmtUSD(state.thr.gdp), rich.length));
    tile(t.t3, med ? (tw.rate / med).toFixed(1) : '—', t.t3unit, t.t3note);
    tile(t.t4, t.t4val(rank), t.t4unit(ranked.length), t.t4note(QNUM[quadOf(tw)], t.quad[quadOf(tw)]));
  }

  // ================================================================ 02 散佈圖
  let pts = [];          // 目前畫面上的點（螢幕座標），給 hover 找最近點用
  function renderChart() {
    const t = T(), box = $('chart');
    box.querySelectorAll('svg').forEach(s => s.remove());
    hideTip();
    const W = Math.max(260, box.clientWidth);
    const mobile = W < 560;
    const H = Math.round(Math.min(660, Math.max(mobile ? 400 : 460, W * 0.62)));
    const m = { t: 30, r: mobile ? 12 : 24, b: 50, l: mobile ? 40 : 56 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;

    const zoom = state.view === 'rich';
    const all = state.data;
    const gmin = Math.min(...all.map(c => c.gdp_pc)), gmax = Math.max(...all.map(c => c.gdp_pc));
    // 放大：橫軸從所得門檻的 0.55 倍開始，縱軸只到這個範圍內國家的最高死亡率
    const xlo = zoom ? state.thr.gdp * 0.55 : gmin * 0.8, xhi = gmax * (zoom ? 1.12 : 1.25);
    const inX = c => c.gdp_pc >= xlo && c.gdp_pc <= xhi;
    // 放大時縱軸只到「富裕國家最高死亡率」再留一點空間；更高的少數國家不畫（說明文字會註明顯示幾國）
    const richMax = Math.max(...all.filter(c => c.gdp_pc >= state.thr.gdp).map(c => c.rate), state.thr.rate);
    const pool = zoom ? all.filter(c => inX(c) && c.rate <= richMax + 4) : all;
    const vis = pool.filter(c => !state.hidden.has(c.group));
    const lx0 = Math.log10(xlo), lx1 = Math.log10(xhi);
    const rmax = Math.max(...pool.map(c => c.rate), state.thr.rate);
    const ystep = rmax > 30 ? 10 : 5;
    const y1 = Math.ceil((rmax + 1) / ystep) * ystep;
    const X = v => m.l + (Math.log10(v) - lx0) / (lx1 - lx0) * pw;
    const padTop = 24;                              // 頂端留白：死亡率最低的國家（新加坡、英國…）上方才放得下標籤
    const Y = v => m.t + padTop + v / y1 * (ph - padTop);   // 倒置：0 在上，越往下死亡率越高

    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': t.chartAria(vis.length) });

    // 格線與刻度
    const gx = sv('g', { class: 'tick' });
    const xticks = [];                               // 與前一個刻度相距不到 42px 就略過，避免標籤黏在一起
    const TICKS = zoom ? [5e3, 7e3, 1e4, 1.5e4, 2e4, 3e4, 5e4, 7e4, 1e5, 1.5e5, 2e5]
                       : [100, 200, 500, 1e3, 2e3, 5e3, 1e4, 2e4, 5e4, 1e5, 2e5];
    for (const v of TICKS) {
      if (Math.log10(v) < lx0 || Math.log10(v) > lx1) continue;
      if (xticks.length && X(v) - X(xticks[xticks.length - 1]) < 42) continue;
      xticks.push(v);
    }
    xticks.forEach(v => {
      gx.appendChild(sv('line', { x1: X(v), x2: X(v), y1: m.t, y2: m.t + ph, class: 'gridline' }));
      const tx = sv('text', { x: X(v), y: m.t + ph + 16, 'text-anchor': 'middle' });
      tx.textContent = v >= 1e3 ? '$' + (v / 1e3) + 'k' : '$' + v;
      gx.appendChild(tx);
    });
    for (let v = 0; v <= y1; v += ystep) {
      gx.appendChild(sv('line', { x1: m.l, x2: m.l + pw, y1: Y(v), y2: Y(v), class: 'gridline' }));
      const ty = sv('text', { x: m.l - 8, y: Y(v) + 4, 'text-anchor': 'end' });
      ty.textContent = v;
      gx.appendChild(ty);
    }
    svg.appendChild(gx);
    svg.appendChild(sv('line', { x1: m.l, x2: m.l + pw, y1: m.t + ph, y2: m.t + ph, class: 'axisline' }));
    svg.appendChild(sv('line', { x1: m.l, x2: m.l, y1: m.t, y2: m.t + ph, class: 'axisline' }));
    const xt = sv('text', { x: m.l + pw, y: H - 8, 'text-anchor': 'end', class: 'axis-title' });
    xt.textContent = t.xTitle; svg.appendChild(xt);
    const yt = sv('text', { x: m.l, y: m.t - 12, 'text-anchor': 'start', class: 'axis-title' });
    yt.textContent = mobile ? t.yTitleShort : t.yTitle; svg.appendChild(yt);

    // 門檻線（參考線，實線）
    const tx = X(state.thr.gdp), ty = Y(state.thr.rate);
    if (tx > m.l && tx < m.l + pw) svg.appendChild(sv('line', { x1: tx, x2: tx, y1: m.t, y2: m.t + ph, class: 'thrline' }));
    svg.appendChild(sv('line', { x1: m.l, x2: m.l + pw, y1: ty, y2: ty, class: 'thrline' }));

    // 象限標籤與國家數（空間不夠時逐級縮短；全名見提示框與比較表）
    const qn = { 1: 0, 2: 0, 3: 0, 4: 0 };
    all.filter(c => !state.hidden.has(c.group)).forEach(c => qn[quadOf(c)]++);
    const qpos = {
      2: { x: m.l + 8, y: m.t + 16, a: 'start' },  1: { x: m.l + pw - 8, y: m.t + 16, a: 'end' },
      4: { x: m.l + 8, y: m.t + ph - 22, a: 'start' }, 3: { x: m.l + pw - 8, y: m.t + ph - 22, a: 'end' },
    };
    const qg = sv('g'), qt = {};
    [1, 2, 3, 4].forEach(q => {
      const p = qpos[q];
      qt[q] = sv('text', { x: p.x, y: p.y, 'text-anchor': p.a, class: 'qlabel' });
      const c = sv('text', { x: p.x, y: p.y + 15, 'text-anchor': p.a, class: 'qcount' });
      c.textContent = t.qcount(qn[q]);
      qg.appendChild(qt[q]); qg.appendChild(c);
    });
    svg.appendChild(qg);
    box.appendChild(svg);                       // 先掛上，才量得到文字寬度
    const clash = (a, b) => { const A = a.getBBox(), B = b.getBBox(); return A.x + A.width + 10 > B.x; };
    for (const form of [t.quad, ...t.quadForms, { 1: '', 2: '', 3: '', 4: '' }]) {
      [1, 2, 3, 4].forEach(q => { qt[q].textContent = form[q] ? `${QNUM[q]} ${form[q]}` : QNUM[q]; });
      if (!clash(qt[2], qt[1]) && !clash(qt[4], qt[3])) break;
    }

    // 點：先畫背景國家，再畫突顯國家，台灣最後（永遠在最上層）
    const order = vis.slice().sort((a, b) => (isHi(a) - isHi(b)) || ((a.iso3 === 'TWN') - (b.iso3 === 'TWN')));
    const anyHi = vis.some(c => c.iso3 !== 'TWN' && isHi(c));
    const layer = sv('g');
    pts = [];
    order.forEach(c => {
      const x = X(c.gdp_pc), y = Y(c.rate), hi = isHi(c), tw = c.iso3 === 'TWN';
      const r = tw ? 7.5 : hi ? 6 : 4.2;
      const p = sv('path', { d: shapePath(GROUP[c.group].shape, x, y, r),
        class: `pt g-${c.group}${!hi && anyHi ? ' bg' : ''}` });
      p.dataset.iso = c.iso3;
      layer.appendChild(p);
      if (tw) layer.appendChild(sv('circle', { cx: x, cy: y, r: r + 5, class: 'tw-ring' }));
      pts.push({ c, x, y, r, vr: tw ? r + 6 : r, node: p, hi });   // vr：可見範圍（台灣含外環）
    });
    svg.appendChild(layer);
    svg.appendChild(qg);                         // 象限標籤移到點的上層（有表面色描邊，不會被點蓋住）

    // 直接標籤：依優先順序擺放；貼著點放不下就拉一條引導線放遠一點；仍放不下就交給提示框與比較表
    const placed = [];
    qg.querySelectorAll('text').forEach(e => { const b = e.getBBox(); placed.push({ x: b.x - 2, y: b.y - 1, w: b.width + 4, h: b.height + 2 }); });
    const hiPts = pts.filter(p => p.hi);
    const PAD = 4;                                   // 點的周圍留 4px：標籤和引導線不能貼著別人的點，否則會被誤認
    hiPts.forEach(p => placed.push({ x: p.x - p.vr - PAD, y: p.y - p.vr - PAD, w: 2 * (p.vr + PAD), h: 2 * (p.vr + PAD), own: p }));
    const leaders = sv('g'), anchors = sv('g'), lab = sv('g');
    svg.appendChild(leaders); svg.appendChild(lab);
    const prio = c => { const i = LABEL_PRIORITY.indexOf(c.iso3); return i < 0 ? 999 : i; };
    const toLabel = hiPts.slice().sort((a, b) => prio(a.c) - prio(b.c));
    const maxLabels = mobile ? 10 : 45;
    // 貼著點放只允許正上下左右；斜角或放遠一點時一律畫引導線，避免看不出標籤屬於哪個點
    const ORTHO = [[1, 0], [-1, 0], [0, -1], [0, 1]];
    const ALL16 = Array.from({ length: 16 }, (_, i) => [Math.cos(i * Math.PI / 8), Math.sin(i * Math.PI / 8)])
      .map(([x, y]) => [Math.round(x * 1000) / 1000, Math.round(y * 1000) / 1000]);
    const segs = [];                                 // 已畫的引導線：標籤不可壓在上面，新引導線也不可穿過標籤
    const segHitsRect = (x1, y1, x2, y2, r) => {     // Liang–Barsky 線段裁切
      let t0 = 0, t1 = 1; const dx = x2 - x1, dy = y2 - y1;
      for (const [pp, qq] of [[-dx, x1 - r.x], [dx, r.x + r.w - x1], [-dy, y1 - r.y], [dy, r.y + r.h - y1]]) {
        if (pp === 0) { if (qq < 0) return false; continue; }
        const tt = qq / pp;
        if (pp < 0) { if (tt > t1) return false; if (tt > t0) t0 = tt; } else { if (tt < t0) return false; if (tt < t1) t1 = tt; }
      }
      return true;
    };
    const ptSeg = (px, py, a) => {                  // 點到線段距離
      const dx = a[2] - a[0], dy = a[3] - a[1], L2 = dx * dx + dy * dy || 1;
      const u = Math.max(0, Math.min(1, ((px - a[0]) * dx + (py - a[1]) * dy) / L2));
      return Math.hypot(px - (a[0] + u * dx), py - (a[1] + u * dy));
    };
    const segsTooClose = (a, b) => {                 // 兩條引導線交叉或相距不到 6px（會看起來像同一條線）
      const cross = (p1x, p1y, p2x, p2y, p3x, p3y) => (p2x - p1x) * (p3y - p1y) - (p2y - p1y) * (p3x - p1x);
      const d1 = cross(b[0], b[1], b[2], b[3], a[0], a[1]), d2 = cross(b[0], b[1], b[2], b[3], a[2], a[3]);
      const d3 = cross(a[0], a[1], a[2], a[3], b[0], b[1]), d4 = cross(a[0], a[1], a[2], a[3], b[2], b[3]);
      if (((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0))) return true;
      return Math.min(ptSeg(a[0], a[1], b), ptSeg(a[2], a[3], b), ptSeg(b[0], b[1], a), ptSeg(b[2], b[3], a)) < 6;
    };
    const anchored = new Set(), crossed = new Set();  // 有錨點的點／被別人的引導線穿過的點
    let nlab = 0;
    toLabel.forEach(p => {
      if (nlab >= maxLabels && p.c.iso3 !== 'TWN') return;
      const e = sv('text', { class: 'plabel' + (p.c.iso3 === 'TWN' ? ' tw' : '') });
      e.textContent = nameOf(p.c);
      lab.appendChild(e);
      const bb = e.getBBox(), w = bb.width, h = bb.height;
      const base = p.vr + (p.c.iso3 === 'TWN' ? 3 : 4);
      // crossOK：引導線可經過別的點（起點有錨點標示歸屬，不會誤認）；標籤本身仍須離所有點 4px
      const tryAt = (dist, leader, dirs, crossOK) => {
        for (const [dx, dy] of dirs) {
          const ax = p.x + dx * dist, ay = p.y + dy * dist;
          const anc = dx > 0.1 ? 'start' : dx < -0.1 ? 'end' : 'middle';
          const x0 = anc === 'start' ? ax : anc === 'end' ? ax - w : ax - w / 2;
          const top = dy < -0.1 ? ay - h : dy > 0.1 ? ay : ay - h / 2;
          const rect = { x: x0 - 2, y: top - 1, w: w + 4, h: h + 2 };
          if (rect.x < m.l || rect.x + rect.w > m.l + pw || rect.y < m.t || rect.y + rect.h > m.t + ph) continue;
          if (placed.some(q => q.own !== p && rect.x < q.x + q.w && rect.x + rect.w > q.x && rect.y < q.y + q.h && rect.y + rect.h > q.y)) continue;
          if (segs.some(g => segHitsRect(g[0], g[1], g[2], g[3], rect))) continue;
          let seg = null;
          if (leader) {
            seg = [p.x, p.y, ax - dx * 2, ay - dy * 2];                // 從點的中心拉出，中心畫錨點
            const segOut = [p.x + dx * (p.vr + 1), p.y + dy * (p.vr + 1), seg[2], seg[3]];
            if (crossed.has(p)) continue;              // 已有別人的線穿過這個點：再加錨點會分不清
            const hits = placed.filter(q => q.own !== p && segHitsRect(segOut[0], segOut[1], segOut[2], segOut[3], q));
            if (hits.some(q => !q.own || !crossOK || anchored.has(q.own))) continue;   // 不穿過標籤、不穿過有錨點的點
            seg.crosses = hits.map(q => q.own);
            if (segs.some(g => segsTooClose(segOut, [g[0] + (g[2] - g[0]) * 0.001, g[1] + (g[3] - g[1]) * 0.001, g[2], g[3]]))) continue;
          }
          e.setAttribute('x', ax); e.setAttribute('y', top + h * 0.78); e.setAttribute('text-anchor', anc);
          placed.push(rect);
          if (seg) {
            segs.push(seg);
            anchored.add(p); seg.crosses.forEach(o => crossed.add(o));
            leaders.appendChild(sv('line', { class: 'leader', x1: seg[0], y1: seg[1], x2: seg[2], y2: seg[3] }));
            anchors.appendChild(sv('circle', { class: 'anchor', cx: p.x, cy: p.y, r: 2 }));
          }
          return true;
        }
        return false;
      };
      // 先找引導線不經過任何點的位置；不行再允許引導線經過別的點（起點的錨點標示歸屬）。
      // 標籤一律不貼著任何點、線與線不交會。放不下的國家仍可從提示框與比較表查到。
      const D = [16, 28, 42, 58, 76, 96, 118];
      if (tryAt(base, false, ORTHO) || D.some(d => tryAt(base + d, true, ALL16, false)) || D.some(d => tryAt(base + d, true, ALL16, true))) nlab++;
      else e.remove();
    });

    svg.appendChild(anchors);                    // 錨點在點的上層

    // 可聚焦的突顯點（鍵盤可逐一瀏覽，與滑鼠提示框同內容）
    const kb = sv('g');
    hiPts.forEach(p => {
      const hit = sv('circle', { cx: p.x, cy: p.y, r: Math.max(12, p.r + 6), class: 'focus-hit', tabindex: '0', role: 'img',
        'aria-label': t.pointAria(nameOf(p.c), fmt1(p.c.rate), fmtUSD(p.c.gdp_pc), quadOf(p.c)) });
      hit.addEventListener('focus', () => showTip(p));
      hit.addEventListener('blur', hideTip);
      kb.appendChild(hit);
      kb.appendChild(sv('circle', { cx: p.x, cy: p.y, r: p.r + 4, class: 'focus-ring', fill: 'none' }));
    });
    svg.appendChild(kb);

    // 滑鼠：找最近的點（24px 內），不必精準點中 8px 的點
    const ov = sv('rect', { x: m.l, y: m.t, width: pw, height: ph, fill: 'transparent' });
    svg.insertBefore(ov, kb);
    const nearest = ev => {
      const rect = svg.getBoundingClientRect(), k = rect.width / W;
      const mx = (ev.clientX - rect.left) / k, my = (ev.clientY - rect.top) / k;
      // 量到標記「可見邊緣」而非中心：滑到台灣的外環上，就該是台灣
      let best = null, bd = 24 / k;
      for (const p of pts) {
        const d = Math.max(0, Math.hypot(p.x - mx, p.y - my) - p.vr);
        if (d < bd || (d === bd && best && p.hi && !best.hi)) { bd = d; best = p; }
      }
      return best;
    };
    svg.addEventListener('pointermove', ev => { const p = nearest(ev); p ? showTip(p) : hideTip(); });
    svg.addEventListener('pointerleave', hideTip);
    svg.addEventListener('pointerdown', ev => { const p = nearest(ev); p ? showTip(p) : hideTip(); });

    const hid = state.hidden.size ? t.hidden([...state.hidden].map(k => t.groups[k]).join(t.sep)) : '';
    $('caption').textContent = t.caption(fmtUSD(state.thr.gdp), fmt1(state.thr.rate), hid) + (zoom ? t.zoomNote(vis.length) : '');
  }

  let hot = null;
  function showTip(p) {
    const t = T(), tip = $('tip'), c = p.c;
    if (hot && hot !== p.node) hot.classList.remove('hot');
    hot = p.node; hot.classList.add('hot');
    tip.textContent = '';
    const top = el('div');
    top.appendChild(el('span', { class: 'tv' }, fmt1(c.rate)));
    top.appendChild(el('span', { class: 'tu' }, t.unit));
    tip.appendChild(top);
    const name = el('div', { class: 'tn' });
    const key = el('span', { class: 'key' }); key.style.background = `var(--c-${c.group})`;
    name.appendChild(key); name.appendChild(el('span', null, nameOf(c)));
    name.appendChild(el('span', { class: 'ten' }, altName(c)));
    tip.appendChild(name);
    const dl = el('dl');
    const row = (k, v) => { dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, v)); };
    row(t.tipGdp, fmtUSD(c.gdp_pc));
    row(t.tipDensity, c.density != null ? `${fmtInt(c.density)} /km²` : '—');
    row(t.tipIncome, t.income[c.income] || '—');
    row(t.tipGroup, t.groups[c.group]);
    if (c.rate_low != null && c.rate_high != null) row(t.tipCI, `${fmt1(c.rate_low)}–${fmt1(c.rate_high)}`);
    tip.appendChild(dl);
    tip.appendChild(el('div', { class: 'tq' }, quadText(quadOf(c))));
    if (c.tags.length) tip.appendChild(el('div', { class: 'tsrc' }, t.tipTags + c.tags.map(k => t.tags[k]).join(t.sep)));
    if (c.rate_source === 'MOTC') {
      const v = state.meta.taiwan && state.meta.taiwan.verified === false ? t.tipUnverified : '';
      tip.appendChild(el('div', { class: 'tsrc' }, t.tipTW(v)));
    }
    tip.style.display = 'block';
    const box = $('chart'), svg = box.querySelector('svg');
    const k = svg.getBoundingClientRect().width / +svg.getAttribute('viewBox').split(' ')[2];
    const bw = box.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = p.x * k + 14, topY = p.y * k - th / 2;
    if (left + tw > bw) left = p.x * k - tw - 14;
    if (left < 0) left = Math.max(0, Math.min(bw - tw, p.x * k - tw / 2));
    topY = Math.max(0, Math.min(topY, box.clientHeight - th));
    tip.style.left = left + 'px'; tip.style.top = topY + 'px';
  }
  function hideTip() {
    $('tip').style.display = 'none';
    if (hot) { hot.classList.remove('hot'); hot = null; }
  }

  // ================================================================ 03 比較表（圖表的無障礙等價物）
  const COLS = [
    { key: 'name' }, { key: 'group' }, { key: 'rate', num: true }, { key: 'gdp_pc', num: true },
    { key: 'density', num: true }, { key: 'quad' }, { key: 'tags' },
  ];
  function renderTable() {
    const t = T(), tb = $('table');
    tb.textContent = '';
    const rows = state.data.filter(c => state.showAll || isHi(c));
    const s = state.sort;
    const val = (c, k) => k === 'quad' ? quadOf(c) : k === 'group' ? t.groups[c.group] : k === 'tags' ? c.tags.length
      : k === 'name' ? nameOf(c) : c[k];
    rows.sort((a, b) => {
      const va = val(a, s.key), vb = val(b, s.key);
      if (va == null) return 1; if (vb == null) return -1;
      return (typeof va === 'string' ? va.localeCompare(vb, t.locale) : va - vb) * s.dir;
    });
    const thead = el('thead'), hr = el('tr');
    COLS.forEach(col => {
      const th = el('th', { scope: 'col', class: col.num ? 'num' : '' });
      if (s.key === col.key) th.setAttribute('aria-sort', s.dir > 0 ? 'ascending' : 'descending');
      const b = el('button', { type: 'button' }, t.cols[col.key]);
      b.addEventListener('click', () => { state.sort = { key: col.key, dir: s.key === col.key ? -s.dir : 1 }; renderTable(); });
      th.appendChild(b); hr.appendChild(th);
    });
    thead.appendChild(hr); tb.appendChild(thead);
    const tbody = el('tbody');
    const unverified = state.meta.taiwan && state.meta.taiwan.verified === false;
    rows.forEach(c => {
      const tr = el('tr', c.iso3 === 'TWN' ? { class: 'tw' } : null);
      const name = el('td');
      name.appendChild(document.createTextNode(nameOf(c)));
      if (c.iso3 === 'TWN' && unverified) name.appendChild(el('span', { class: 'badge' }, t.badge));
      tr.appendChild(name);
      const g = el('td'); const sw = el('span', { class: 'swatch' });
      sw.appendChild(keySwatch(c.group, 12)); sw.appendChild(document.createTextNode(t.groups[c.group]));
      g.appendChild(sw); tr.appendChild(g);
      tr.appendChild(el('td', { class: 'num' }, fmt1(c.rate)));
      tr.appendChild(el('td', { class: 'num' }, fmtInt(c.gdp_pc)));
      tr.appendChild(el('td', { class: 'num' }, c.density != null ? fmtInt(c.density) : '—'));
      tr.appendChild(el('td', null, quadText(quadOf(c))));
      const tg = el('td');
      c.tags.forEach(k => tg.appendChild(el('span', { class: 'tagchip' }, t.tags[k])));
      tr.appendChild(tg);
      tbody.appendChild(tr);
    });
    tb.appendChild(tbody);
    $('tcount').textContent = state.showAll ? t.tcountAll(rows.length) : t.tcount(rows.length - 1);
  }

  // ================================================================ 04 資料與方法
  function buildNotes() {
    const m = state.meta, tw = m.taiwan || {}, en = state.lang === 'en';
    const gen = String(m.generated).replace(/[^0-9-]/g, '');
    const band = m.density_band ? `${fmtInt(m.density_band[0])}–${fmtInt(m.density_band[1])}` : '';
    const glob = m.global_rate != null
      ? (en ? `the WHO global estimate (${fmt1(m.global_rate)} per 100,000)` : `WHO 全球估計值（${fmt1(m.global_rate)}／十萬人）`)
      : (en ? 'the median across countries (no WHO global estimate in the data)' : '各國中位數（資料未含 WHO 全球估計值）');
    const sec = en ? [
      ['Sources', [
        `<strong>Road traffic death rate</strong>: WHO Global Health Observatory, indicator <code>RS_198</code> (estimated road traffic death rate per 100,000 population), ${m.year}. These are the estimates behind WHO’s <em>Global Status Report on Road Safety</em>.`,
        '<strong>GDP per capita</strong>: IMF World Economic Outlook, <code>NGDPDPC</code> (current US$, not PPP). The IMF covers Taiwan, so Taiwan and every other country share one GDP source.',
        '<strong>Population density, income groups</strong>: World Bank WDI <code>EN.POP.DNST</code> and the World Bank country classification.',
      ]],
      ['Taiwan’s figures', [
        `Taiwan is not in the WHO or World Bank data. Its rate is <strong>30-day road deaths from the Ministry of Transportation and Communications</strong> (${tw.deaths_30d ? fmtInt(tw.deaths_30d) : '—'}, the sum of all counties plus national freeways, from the MOTC road-safety dashboard) divided by the IMF population for the same year (${tw.population_m ? tw.population_m + ' million' : '—'}).`,
        `WHO also uses the 30-day definition for countries with complete death registration, so the two are broadly comparable, though not produced by the same model.${tw.verified === false ? ' <strong>Taiwan’s figures have not yet been checked against official statistics</strong> and are marked “Unverified”.' : ''}`,
        `Population density is IMF population ÷ ${tw.area_km2 ? fmtInt(tw.area_km2) + ' km²' : 'land area'} (Executive Yuan, area under effective jurisdiction).`,
      ]],
      ['How the quadrants are cut', [
        `The <strong>income line</strong> defaults to the World Bank high-income threshold for ${m.year} data (${fmtUSD(m.gdp_threshold)}). The World Bank classifies by GNI (Atlas method) while this chart plots GDP, so countries close to the line are indicative only.`,
        `The <strong>death-rate line</strong> defaults to ${glob}. Both lines can be dragged; every number on the page, including section 01, updates live.`,
        'The vertical axis is <strong>inverted</strong>: higher up means fewer deaths. So ① high-income · low deaths is top right, ② low/middle-income · low deaths top left, ③ high-income · high deaths bottom right and ④ low/middle-income · high deaths bottom left. The numbering follows the research definition, not the counter-clockwise order of a mathematical plane.',
      ]],
      ['How “similar” and “major” countries are chosen', [
        `<strong>Similar density</strong> is decided by the data: between 0.5 and 2 times Taiwan’s density (${band} /km²).`,
        '<strong>Similar culture</strong> (Sinosphere / East Asia), <strong>similar climate</strong> (tropical or subtropical monsoon), <strong>motorcycle-dominant</strong> and <strong>policy benchmarks</strong> (the Netherlands’ Sustainable Safety, Sweden’s Vision Zero) are judged by hand; the list is <code>FOCUS</code> in <code>scripts/build_road_safety.py</code> and can be edited there.',
        '<strong>Major countries</strong> (for example the United States, Germany and Australia) are not chosen for similarity; they give readers familiar reference points. The list is <code>MAJOR</code> in the same script.',
        '“Motorcycle-dominant” was not in the original brief, but motorcycles are the leading mode in Taiwan’s road deaths, which makes it one of the most important confounders when comparing countries.',
      ]],
      ['Why only four continent groups', [
        'On a scatter plot any two points can sit side by side, so every pair of colours must stay distinguishable. Tested under colour-blindness simulation (protanopia / deuteranopia), <strong>none</strong> of the 28 ways to pick six of the eight category colours passed, and no five-colour set passed either; four colours do.',
        'Countries are therefore grouped as Asia & Oceania, Europe, the Americas and Africa, with <strong>shape</strong> (circle, square, triangle, diamond) as a second cue so colour-blind readers can tell them apart. Asia includes the Middle East; Russia counts as Europe, Türkiye and Cyprus as Asia.',
      ]],
      ['Limitations', [
        'Where death registration is incomplete WHO models the estimate, and uncertainty can be large (hover a point for the 95% interval). WHO estimates also differ from national figures: for the United States, for example, WHO’s estimate is well above the US national count.',
        'GDP per capita is in current US dollars and moves with exchange rates; purchasing-power parity (PPP) is better for comparing living standards.',
        'This is a single-year cross-section and shows association, not causation: income, motorisation, mode share, road design and enforcement all shape death rates at the same time.',
      ]],
    ] : [
      ['資料來源', [
        `<strong>道路交通死亡率</strong>：WHO Global Health Observatory，指標 <code>RS_198</code>（Estimated road traffic death rate per 100 000 population），${m.year} 年。這是 WHO《Global Status Report on Road Safety》所用的同一套估計值。`,
        '<strong>人均 GDP</strong>：IMF World Economic Outlook，<code>NGDPDPC</code>（現價美元，非購買力平價）。IMF 有收錄台灣，因此台灣與各國用同一個 GDP 來源。',
        '<strong>人口密度、所得分組</strong>：World Bank WDI <code>EN.POP.DNST</code> 與國家所得分類。',
      ]],
      ['台灣的數字', [
        `台灣不在 WHO 與 World Bank 的資料中。死亡率改以<strong>交通部「30 日死亡人數」</strong>（${tw.deaths_30d ? fmtInt(tw.deaths_30d) + ' 人' : '—'}，道安資訊查詢網各縣市加國道合計）除以 IMF 同年人口（${tw.population_m ? tw.population_m + ' 百萬人' : '—'}）換算。`,
        `WHO 對死亡登記完整的國家同樣採 30 日定義，因此兩者大致可比，但並非同一套推估模型。${tw.verified === false ? '<strong>目前台灣的數字尚未與官方統計核對</strong>，頁面上標示為「待核對」。' : ''}`,
        `人口密度以 IMF 人口 ÷ 土地面積 ${tw.area_km2 ? fmtInt(tw.area_km2) + ' km²' : ''}（行政院國情簡介，有效管轄面積）計算。`,
      ]],
      ['四象限怎麼切', [
        `<strong>所得門檻</strong>預設為 World Bank ${m.year} 年資料的高所得門檻 ${fmtUSD(m.gdp_threshold)}。注意 World Bank 以 GNI（Atlas 法）分類，本圖橫軸是 GDP，門檻附近國家的分類僅供參考。`,
        `<strong>死亡率門檻</strong>預設為${glob}。兩條門檻線都可以拖曳調整，所有數字（含 01 的統計）會即時重算。`,
        '縱軸<strong>倒置</strong>：越往上死亡率越低、越安全。因此 ① 富裕低死亡在右上、② 中低收入低死亡在左上、③ 富裕高死亡在右下、④ 中低收入高死亡在左下。象限編號沿用研究定義，並非數學座標的逆時針順序。',
      ]],
      ['「相似國家」與「主要國家」怎麼選', [

        '<strong>文化相近</strong>（漢字文化圈／東亞）、<strong>氣候相近</strong>（熱帶或亞熱帶季風）、<strong>機車為主</strong>、<strong>政策標竿</strong>（荷蘭 Sustainable Safety、瑞典 Vision Zero）為人工判定，判定清單寫在 <code>scripts/build_road_safety.py</code> 的 <code>FOCUS</code>，可以直接修改。',
        '<strong>主要國家</strong>（例如美國、德國、澳洲）不是依相似度挑選，而是讓讀者有熟悉的參照點；清單是同一支腳本裡的 <code>MAJOR</code>。',
        '「機車為主」不在原始需求中，但機車是台灣交通死亡的主要運具，是比較時最重要的干擾因子之一，因此一併標出。',
      ]],
      ['為什麼大洲只分 4 組', [
        '散佈圖上任兩個點都可能相鄰，所以每一對顏色都必須分得出來。以色盲模擬（protanopia／deuteranopia）驗證，8 種分類色取 6 種的 28 種組合<strong>全部</strong>無法通過門檻，連 5 色也全數失敗；4 色才能通過。',
        '因此分為「亞洲・大洋洲」「歐洲」「美洲」「非洲」，並以<strong>形狀</strong>（圓、方、三角、菱）做第二編碼，色盲讀者也能分辨。亞洲包含中東；俄羅斯歸歐洲、土耳其與賽普勒斯歸亞洲。',
      ]],
      ['限制', [
        '對死亡登記不完整的國家，WHO 以模型推估，不確定性可能很大（滑過點可看 95% 區間）。WHO 估計值也可能和各國官方數字不同，例如美國的 WHO 估計值明顯高於美國自己的統計。',
        '人均 GDP 為現價美元，受匯率影響；若要比較生活水準，購買力平價（PPP）較合適。',
        '單一年度的橫斷面比較，不代表因果關係：所得、機動化程度、運具組成、道路設計與執法都會同時影響死亡率。',
      ]],
    ];
    $('notes').innerHTML = sec.map(([h, items]) => `<h3>${h}</h3><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`).join('') +
      `<p style="margin-top:12px;font-size:12px;color:var(--muted)">${en ? 'Data build' : '資料建置'}：<code>python3 scripts/build_road_safety.py</code>（${gen}${en ? '' : ' 產生'}）</p>`;
  }
})();
</script>
